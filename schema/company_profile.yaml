ai4s:                         # 为什么属于 AI for Science
  research_stage: []         # 假设生成 | 分子/材料/蛋白设计 | 性质预测与虚拟筛选 | 科学模拟 | 实验规划与决策 | 自动化/自主实验室 | 科学数据生产
