  investor_profile: ""       # 美元 VC / 人民币 VC / 产业资本 / 国资 / 保险资金 / 天使

team:
  members: []                # {name, role, education, career, highlights, is_registered_officer}
  size: ""                   # 参保人数 / 员工规模及年份
  founder_market_fit: ""

judgement:
